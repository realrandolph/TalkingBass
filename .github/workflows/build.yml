name: Build LV2 bundles

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LV2 development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential lv2-dev pkg-config
      - name: Build LV2 bundle
        run: make bundle CC=gcc
      - uses: actions/upload-artifact@v4
        with:
          name: talkingbass-linux-x86_64
          path: build/
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LV2 development headers
        run: brew install lv2 pkgconf
      - name: Build universal LV2 bundle
        run: make bundle CC=clang MACOS_ARCHS='-arch x86_64 -arch arm64'
      - uses: actions/upload-artifact@v4
        with:
          name: talkingbass-macos-universal
          path: build/
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lv2
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build Windows LV2 bundle
        shell: msys2 {0}
        run: make bundle CC=gcc
      - uses: actions/upload-artifact@v4
        with:
          name: talkingbass-windows-x86_64
          path: build/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Package release archives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          bundles = (
              "talkingbass-linux-x86_64",
              "talkingbass-macos-universal",
              "talkingbass-windows-x86_64",
          )
          for name in bundles:
              bundle = Path("release-artifacts", name, "talkingbass.lv2")
              if not bundle.is_dir():
                  raise SystemExit(f"Missing bundle directory: {bundle}")
              with ZipFile(f"{name}.zip", "w", ZIP_DEFLATED) as archive:
                  for file in sorted(bundle.rglob("*")):
                      if file.is_file():
                          archive.write(file, file.relative_to(bundle.parent))
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            talkingbass-linux-x86_64.zip
            talkingbass-macos-universal.zip
            talkingbass-windows-x86_64.zip
